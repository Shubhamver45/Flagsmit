[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flagsmith-guardian"
version = "0.1.0"
description = "Autonomous, metric-guarded phased rollout and automated rollback controller for Flagsmith"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "flask>=3.0.3",
]

[project.scripts]
guardian = "guardian.cli:main"
switchguard = "guardian.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian*"]
