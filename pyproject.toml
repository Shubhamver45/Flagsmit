[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flagsmith-guardian"
version = "0.1.0"
description = "Autonomous, metric-guarded phased rollout and automated rollback controller for Flagsmith"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "flask>=3.0.3",
]

[project.urls]
Homepage = "https://github.com/Shubhamver45/flagsmith-guardian"
Repository = "https://github.com/Shubhamver45/flagsmith-guardian"
Issues = "https://github.com/Shubhamver45/flagsmith-guardian/issues"
Changelog = "https://github.com/Shubhamver45/flagsmith-guardian/blob/main/CHANGELOG.md"

[project.scripts]
guardian = "guardian.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian*"]
