apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  GUARDIAN_API_TOKEN: {{ .Values.secrets.guardianApiToken | quote }}
  FLAGSMITH_WEBHOOK_SECRET: {{ .Values.secrets.flagsmithWebhookSecret | quote }}
  FLAGSMITH_ADMIN_API_KEY: {{ .Values.secrets.flagsmithAdminApiKey | quote }}
  FLAGSMITH_ENVIRONMENT_KEY: {{ .Values.secrets.flagsmithEnvironmentKey | quote }}
