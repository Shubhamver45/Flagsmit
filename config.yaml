# Guardian Rollout Configuration
flag_name: "new_checkout"
# environment_key is loaded from .env (or resolved dynamically from Flagsmith)
environment_key: ""

# Phased rollout percentages
stages:
  - 1
  - 5
  - 25
  - 100

# Soak time per stage (in seconds for live demo responsiveness)
soak_time_seconds: 15

# Require human operator approval before final 100% promotion
require_approval_before_final: true

# Guardrail metric sources
guardrails:
  - name: "new_flow_error_rate"
    metric_source: "prometheus"
    comparison: ">"
    threshold: 5.0
    query: "((sum(rate(checkout_errors_total{variant='new_flow'}[30s])) or vector(0)) / (sum(rate(checkout_requests_total{variant='new_flow'}[30s])) > 0 or vector(1))) * 100"
    sample_size_query: "sum(checkout_requests_total)"
    min_samples: 25
    description: "Trigger immediate rollback to 0% if new flow error rate exceeds 5.0%"

  - name: "checkout_ab_chance_to_be_worse"
    metric_source: "flagsmith_experiment"
    metric_id: 1
    comparison: ">"
    threshold: 10.0
    min_samples: 50
    action_on_srm: "HOLD"
    description: "Hold rollout if Bayesian chance-to-be-worse > 10.0% or if SRM warning fires"
