name: flagsmith-guardian-demo

# One-command full demo stack:
#   docker compose -f compose.demo.yml up
# Starts self-hosted Flagsmith (API, task processor, Postgres), Prometheus,
# sample checkout app + continuous traffic simulator, one-shot Flagsmith setup,
# and Guardian (from ghcr.io/shubhamver45/flagsmith-guardian:latest) at http://localhost:8080.

# DEMO-ONLY, never use in production (API keys, webhook secret, and Guardian token are generated randomly at startup by setup-flagsmith).
x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith  # demo-only, never use in production
  USE_POSTGRES_FOR_ANALYTICS: 'true'
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: '*'
  FLAGSMITH_DOMAIN: flagsmith:8000
  DJANGO_SECRET_KEY: secret-flagsmith-key  # demo-only, never use in production
  WAREHOUSE_CREDENTIALS_SECRET: secret-warehouse-key  # demo-only, never use in production
  TASK_RUN_METHOD: TASK_PROCESSOR
  PROMETHEUS_ENABLED: 'true'
  EXPERIMENTATION_ENABLED: 'true'
  SSRF_ALLOWED_HOSTS: 'host.docker.internal,127.0.0.1,localhost,guardian'

volumes:
  pgdata:
  guardian-data:
  shared-env:

services:
  postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password  # demo-only, never use in production
      POSTGRES_DB: flagsmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 20s

  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    command:
      - migrate
    environment:
      <<: *flagsmith-env
      TASK_PROCESSOR_SLEEP_INTERVAL_MS: 250
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - serve
    environment:
      <<: *flagsmith-env
      TASK_PROCESSOR_SLEEP_INTERVAL_MS: 250
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/')\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  flagsmith-task-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *flagsmith-env
      TASK_PROCESSOR_SLEEP_INTERVAL_MS: 250
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    command: run-task-processor

  setup-flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    user: "0:0"
    restart: "no"
    environment:
      <<: *flagsmith-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}  # demo-only, never use in production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-GuardianDemo123!}  # demo-only, never use in production
      GUARDIAN_WEBHOOK_URL: http://guardian:8080/webhooks/flagsmith
    volumes:
      - ./scripts/setup_flagsmith.py:/opt/setup_flagsmith.py:ro
      - shared-env:/shared
    depends_on:
      flagsmith:
        condition: service_healthy
    entrypoint:
      - python
      - -c
      - |
        import os, re, subprocess, sys
        sys.path.insert(0, "/opt")
        from setup_flagsmith import setup_via_admin_api

        proc = subprocess.run(
            ["python", "manage.py", "shell"],
            input="import sys; sys.path.insert(0, '/opt'); from setup_flagsmith import setup_django_shell; setup_django_shell()\n",
            text=True,
            capture_output=True,
        )
        if proc.returncode != 0:
            print(proc.stdout, proc.stderr, file=sys.stderr)
            sys.exit(proc.returncode)

        m = re.search(r"=== DOTENV_START ===\n(.*?)\n=== DOTENV_END ===", proc.stdout, re.DOTALL)
        if not m:
            print(proc.stdout, file=sys.stderr)
            sys.exit(1)

        dotenv_text = m.group(1).replace("http://localhost:8000/api/v1", "http://flagsmith:8000/api/v1")
        with open("/shared/demo.env", "w", encoding="utf-8") as f:
            f.write(dotenv_text + "\n")
        os.chmod("/shared/demo.env", 0o644)

        conf = {}
        for line in dotenv_text.splitlines():
            if "=" in line and not line.strip().startswith("#"):
                k, v = line.split("=", 1)
                conf[k.strip()] = v.strip()

        setup_via_admin_api(
            api_url="http://flagsmith:8000/api/v1",
            admin_api_key=conf["FLAGSMITH_ADMIN_API_KEY"],
            project_id=int(conf["FLAGSMITH_PROJECT_ID"]),
            env_id=int(conf["FLAGSMITH_ENVIRONMENT_ID"]),
            env_key=conf["FLAGSMITH_ENVIRONMENT_KEY"],
            webhook_secret=conf.get("FLAGSMITH_WEBHOOK_SECRET", ""),
            admin_email=conf.get("ADMIN_EMAIL", "admin@example.com"),
            admin_password=conf.get("ADMIN_PASSWORD", ""),
        )
        print("✔ One-shot Flagsmith setup complete.")

  demo-app:
    build:
      context: ./demo
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1/
      BUG_IN_NEW_CHECKOUT: "0"
      PORT: "5000"
    volumes:
      - shared-env:/shared:ro
    entrypoint:
      - sh
      - -c
      - "set -a && . /shared/demo.env && set +a && exec gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 4 --access-logfile - app:app"
    depends_on:
      setup-flagsmith:
        condition: service_completed_successfully

  simulator:
    build:
      context: ./demo
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEMO_APP_URL: http://demo-app:5000/checkout
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ./demo/simulator.py:/app/simulator.py:ro
    entrypoint:
      - python
      - /app/simulator.py
      - --continuous
      - --identities
      - "15"
      - --delay
      - "0.5"
      - --batch
      - "5"
    depends_on:
      - demo-app

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./demo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - demo-app

  guardian:
    image: ghcr.io/shubhamver45/flagsmith-guardian:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      DEMO_MODE: "1"
      DEMO_SOAK_SECONDS: "5"
      DEMO_FORCE_RECALC: "1"
      GUARDIAN_CONFIG_PATH: /app/config.yaml
      GUARDIAN_DB_PATH: /app/data/guardian.db
    volumes:
      - shared-env:/shared:ro
      - guardian-data:/app/data
      - ./config.demo.yaml:/app/config.yaml:ro
    entrypoint:
      - sh
      - -c
      - "set -a && . /shared/demo.env && set +a && exec python -m guardian.main --host 0.0.0.0 --demo-mode --interval 2"
    depends_on:
      setup-flagsmith:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
