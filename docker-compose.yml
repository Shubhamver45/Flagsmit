name: flagsmith

# Flagsmith local deployment with Experimentation & PostgreSQL Analytics
# Based on official https://github.com/Flagsmith/flagsmith/blob/main/docker-compose.yml

x-flagsmith-env: &flagsmith-env
  DATABASE_URL: postgresql://postgres:password@postgres:5432/flagsmith
  USE_POSTGRES_FOR_ANALYTICS: 'true'
  ENVIRONMENT: production
  DJANGO_ALLOWED_HOSTS: '*'
  FLAGSMITH_DOMAIN: localhost:8000
  DJANGO_SECRET_KEY: secret-flagsmith-key
  WAREHOUSE_CREDENTIALS_SECRET: secret-warehouse-key
  TASK_RUN_METHOD: TASK_PROCESSOR
  PROMETHEUS_ENABLED: 'true'
  # Enable Flagsmith Experimentation & Data Warehouse feature
  EXPERIMENTATION_ENABLED: 'true'

volumes:
  pgdata:

services:
  postgres:
    image: postgres:15.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flagsmith
    container_name: flagsmith_postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d flagsmith -U postgres']
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 20s

  migrate-db:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    command:
      - migrate
    environment:
      <<: *flagsmith-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    restart: unless-stopped
    command:
      - serve
    environment:
      <<: *flagsmith-env
    ports:
      - 8000:8000
    depends_on:
      migrate-db:
        condition: service_completed_successfully

  flagsmith-task-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:latest
    restart: unless-stopped
    environment:
      <<: *flagsmith-env
    ports:
      - 8001:8000
    depends_on:
      migrate-db:
        condition: service_completed_successfully
    command: run-task-processor

  demo-app:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: flagsmith_demo_app
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      FLAGSMITH_ENVIRONMENT_KEY: ${FLAGSMITH_ENVIRONMENT_KEY:-}
      FLAGSMITH_API_URL: http://flagsmith:8000/api/v1/
      BUG_IN_NEW_CHECKOUT: "1"
      PORT: "5000"
    depends_on:
      flagsmith:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: flagsmith_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./demo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - demo-app
