name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run unit tests
        run: python -m pytest -v -m "not live" tests/

      - name: Verify imports (smoke test)
        run: python -c "from guardian.engine import GuardianEngine; from guardian.state_machine import RolloutStateMachine; from guardian.flagsmith_client import FlagsmithAdminClient; print('All imports OK')"
