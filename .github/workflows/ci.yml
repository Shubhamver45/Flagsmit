name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  gitleaks:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Syntax and lint check
        run: python -m compileall -q guardian tests

      - name: Run unit tests
        run: python -m pytest -v -m "not live" tests/

      - name: Verify imports (smoke test)
        run: python -c "from guardian.engine import GuardianEngine; from guardian.state_machine import RolloutStateMachine; from guardian.flagsmith_client import FlagsmithAdminClient; print('All imports OK')"

      - name: Verify README claims and links
        run: |
          python scripts/check_readme_claims.py
          python scripts/check_readme_links.py

  container-health-check:
    name: Container Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build local container image
        run: docker build -t test-guardian:ci .

      - name: Verify container runs with env-only dummy config and GET /health responds
        run: |
          docker run -d --name guardian-smoke -p 8080:8080 \
            -e FLAGSMITH_URL="http://localhost:8000/api/v1" \
            -e FLAGSMITH_ADMIN_API_KEY="dummy_admin_key" \
            -e FLAGSMITH_ENVIRONMENT_KEY="dummy_env_key" \
            -e FLAG_NAME="new_checkout" \
            -e PROMETHEUS_URL="http://localhost:9090" \
            -e STAGES="1,5,25,100" \
            -e SOAK_TIME_SECONDS="30" \
            test-guardian:ci

          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then
              echo "Health check succeeded!"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8080/health || (docker logs guardian-smoke && exit 1)
          docker stop guardian-smoke && docker rm guardian-smoke
