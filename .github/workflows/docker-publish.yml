name: Build and Publish Docker Image to GHCR

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shubhamver45/flagsmith-guardian

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build local image for health check
        run: |
          docker build -t test-guardian:local .

      - name: Verify container runs with env-only dummy config and GET /health responds
        run: |
          docker run -d --name guardian-smoke -p 8080:8080 \
            -e FLAGSMITH_URL="http://localhost:8000/api/v1" \
            -e FLAGSMITH_ADMIN_API_KEY="dummy_admin_key" \
            -e FLAGSMITH_ENVIRONMENT_KEY="dummy_env_key" \
            -e FLAG_NAME="new_checkout" \
            -e PROMETHEUS_URL="http://localhost:9090" \
            -e STAGES="1,5,25,100" \
            -e SOAK_TIME_SECONDS="30" \
            test-guardian:local

          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then
              echo "Health check succeeded!"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8080/health || (docker logs guardian-smoke && exit 1)
          docker stop guardian-smoke && docker rm guardian-smoke

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
